<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Космический эскиз</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: #0a0a1a;
            position: relative;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Звезды в эскизном стиле */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }

        /* Луна с эффектом шершавого стекла */
        .moon {
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            top: 40px;
            right: 40px;
            background:
                    radial-gradient(circle at 30% 30%, #f5f5f5, #d0d0d0),
                    repeating-linear-gradient(
                            0deg,
                            rgba(255,255,255,0.1) 0px,
                            rgba(255,255,255,0.1) 1px,
                            transparent 1px,
                            transparent 4px
                    );
            box-shadow:
                    0 0 30px rgba(255, 255, 255, 0.4),
                    inset 5px 5px 15px rgba(255, 255, 255, 0.3),
                    inset -5px -5px 15px rgba(0, 0, 0, 0.3);
            filter: blur(0.5px);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        /* Кратеры на луне */
        .crater {
            position: absolute;
            border-radius: 50%;
            background: rgba(180, 180, 180, 0.4);
            box-shadow: inset 2px 2px 5px rgba(0, 0, 0, 0.3);
        }

        /* Планета в эскизном стиле */
        .planet {
            position: absolute;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            bottom: 10%;
            left: 10%;
            background: radial-gradient(circle at 30% 30%, #3a6186, #1a2a6c);
            box-shadow:
                    0 0 40px rgba(58, 97, 134, 0.5),
                    inset -10px -10px 20px rgba(0, 0, 0, 0.5);
            border: 3px dashed rgba(255, 255, 255, 0.2);
            filter: blur(0.7px);
        }

        /* Кольца планеты */
        .rings {
            position: absolute;
            width: 350px;
            height: 80px;
            border: 8px solid transparent;
            border-top: 8px dashed rgba(255, 255, 255, 0.3);
            border-bottom: 8px dashed rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            bottom: 18%;
            left: 5%;
            transform: rotateX(75deg);
            filter: blur(1px);
        }

        /* Астероид в эскизном стиле */
        .asteroid {
            position: absolute;
            width: 50px;
            height: 35px;
            background: linear-gradient(45deg, #8e8e8e, #5a5a5a);
            border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
            top: 30%;
            left: 15%;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
            border: 2px dashed rgba(255, 255, 255, 0.1);
            animation: float 35s linear infinite;
            filter: blur(0.5px);
        }

        @keyframes float {
            0% { transform: translateX(-100px) rotate(0deg); }
            100% { transform: translateX(calc(100vw + 100px)) rotate(360deg); }
        }

        /* Комета с эскизным хвостом */
        .comet {
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: white;
            border-radius: 50%;
            top: 20%;
            left: 5%;
            box-shadow: 0 0 10px 2px rgba(255, 255, 255, 0.8);
            animation: comet-move 20s linear infinite;
            filter: blur(0.5px);
        }

        .comet::after {
            content: '';
            position: absolute;
            width: 80px;
            height: 3px;
            background: linear-gradient(to right, transparent, white);
            top: 1.5px;
            left: -80px;
            filter: blur(1px);
        }

        @keyframes comet-move {
            0% { transform: translateX(0) translateY(0); }
            100% { transform: translateX(100vw) translateY(100vh); }
        }

        /* Созвездия */
        .constellation {
            position: absolute;
        }

        .star-link {
            position: absolute;
            height: 1px;
            background-color: rgba(255, 255, 255, 0.3);
            transform-origin: 0 0;
        }

        /* Земля вдали */
        .earth {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            top: 60%;
            right: 20%;
            background: radial-gradient(circle at 30% 30%, #1e5799, #0d2b52);
            box-shadow:
                    0 0 20px rgba(30, 87, 153, 0.4),
                    inset -5px -5px 10px rgba(0, 0, 0, 0.5);
            border: 2px dashed rgba(255, 255, 255, 0.1);
            filter: blur(0.7px);
        }

        /* Облака на земле */
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            filter: blur(2px);
        }

        /* Надпись */
        .title {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 24px;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            font-style: italic;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="moon" id="moon"></div>
<div class="earth" id="earth"></div>
<!--<div class="planet"></div>-->
<!--<div class="rings"></div>-->
<!--<div class="asteroid"></div>-->
<!--<div class="comet"></div>-->
<!--<div class="title">Космический эскиз</div>-->

<script>
    // Создание случайных звезд
    const starsContainer = document.getElementById('stars');
    const starCount = 150;

    for (let i = 0; i < starCount; i++) {
        const star = document.createElement('div');
        star.classList.add('star');

        // Случайные позиции и размеры
        const size = Math.random() * 2 + 1;
        star.style.width = `${size}px`;
        star.style.height = `${size}px`;
        star.style.left = `${Math.random() * 100}%`;
        star.style.top = `${Math.random() * 100}%`;

        // Случайная продолжительность мерцания
        star.style.setProperty('--duration', `${Math.random() * 5 + 3}s`);

        starsContainer.appendChild(star);
    }

    // Создание кратеров на луне
    const moon = document.getElementById('moon');
    const craterCount = 8;

    for (let i = 0; i < craterCount; i++) {
        const crater = document.createElement('div');
        crater.classList.add('crater');

        const size = Math.random() * 30 + 10;
        crater.style.width = `${size}px`;
        crater.style.height = `${size}px`;
        crater.style.left = `${Math.random() * 70 + 15}%`;
        crater.style.top = `${Math.random() * 70 + 15}%`;

        moon.appendChild(crater);
    }

    // Создание облаков на земле
    const earth = document.getElementById('earth');
    const cloudCount = 5;

    for (let i = 0; i < cloudCount; i++) {
        const cloud = document.createElement('div');
        cloud.classList.add('cloud');

        const size = Math.random() * 40 + 20;
        cloud.style.width = `${size}px`;
        cloud.style.height = `${size/2}px`;
        cloud.style.left = `${Math.random() * 80 + 10}%`;
        cloud.style.top = `${Math.random() * 80 + 10}%`;

        earth.appendChild(cloud);
    }

    // Создание созвездий
    for (let i = 0; i < 3; i++) {
        createConstellation();
    }

    function createConstellation() {
        const constellation = document.createElement('div');
        constellation.classList.add('constellation');

        const starCount = Math.floor(Math.random() * 5) + 3;
        const stars = [];

        // Создание звезд созвездия
        for (let j = 0; j < starCount; j++) {
            const star = document.createElement('div');
            star.classList.add('star');

            const size = Math.random() * 3 + 2;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.left = `${Math.random() * 80 + 10}%`;
            star.style.top = `${Math.random() * 80 + 10}%`;

            constellation.appendChild(star);
            stars.push(star);
        }

        // Соединение звезд линиями
        for (let j = 0; j < starCount - 1; j++) {
            const link = document.createElement('div');
            link.classList.add('star-link');

            const star1 = stars[j];
            const star2 = stars[j+1];

            const rect1 = star1.getBoundingClientRect();
            const rect2 = star2.getBoundingClientRect();

            const x1 = parseFloat(star1.style.left);
            const y1 = parseFloat(star1.style.top);
            const x2 = parseFloat(star2.style.left);
            const y2 = parseFloat(star2.style.top);

            const length = Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
            const angle = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;

            link.style.width = `${length}%`;
            link.style.left = `${x1}%`;
            link.style.top = `${y1}%`;
            link.style.transform = `rotate(${angle}deg)`;

            constellation.appendChild(link);
        }

        // Позиционирование созвездия на странице
        constellation.style.left = `${Math.random() * 80 + 10}%`;
        constellation.style.top = `${Math.random() * 80 + 10}%`;

        document.body.appendChild(constellation);
    }
</script>
</body>
</html>
