version: '3.8'

services:
  chromium-browser:
    image: lscr.io/linuxserver/chromium:latest
    container_name: remote_chromium
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Moscow
      - CUSTOM_USER=admin          # Логин для входа в веб-панель
      - PASSWORD=your_secure_pwd   # Пароль для входа (измените!)
    volumes:
      - ./chromium-config:/config # Здесь сохранятся сессии, куки и история браузера
    ports:
      - "443:3001"                 # Маппинг внешнего порта 443 на внутренний HTTPS-порт KasmVNC
    shm_size: "2gb"                # Важно для Chrome, чтобы вкладки не падали из-за нехватки памяти
    restart: unless-stopped
